name: FBA real-shipment probe (read only)
on: { workflow_dispatch: {} }
permissions: { contents: write }
concurrency: { group: fbaprobe2, cancel-in-progress: false }
jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Probe
        env: { CRED_ENV: "${{ secrets.CREDENTIALS_ENV }}" }
        run: |
          mkdir -p /tmp/so
          cd feedwork
          printf '%s\n' "$CRED_ENV" > credentials.txt
          python fba_probe2.py 2>&1 | tee /tmp/so/run.log
          rm -f credentials.txt
      - name: Publish
        if: always()
        run: |
          git config user.name "feed-bot"; git config user.email "feed-bot@users.noreply.github.com"
          git checkout --orphan p2-new
          git rm -rf . >/dev/null 2>&1 || true
          cp -a /tmp/so/. .
          git add -A && git commit -qm "probe2" && git push -f origin p2-new:fba-probe2
