name: Labels test
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: labelstest, cancel-in-progress: false }
jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Test
        env: { CRED_ENV: "${{ secrets.CREDENTIALS_ENV }}" }
        run: |
          cd reprice
          printf '%s\n' "$CRED_ENV" > credentials.env
          python labels_test.py 2>&1 | tee labels_test_run.log
          rm -f credentials.env
      - name: Publish
        if: always()
        run: |
          git config user.name "feed-bot"; git config user.email "feed-bot@users.noreply.github.com"
          rm -rf /tmp/so && mkdir -p /tmp/so
          cp reprice/state/labels_* reprice/labels_test_run.log /tmp/so/ 2>/dev/null || true
          git checkout --orphan lab-new
          git rm -rf . >/dev/null 2>&1 || true
          cp -a /tmp/so/. .
          git add -A && git commit -qm "labels test" && git push -f origin lab-new:labels-test
