name: Temu probe (logged out, no commit)
# Can a cloud runner read Temu products + prices? Images/video/fonts/CSS always blocked.
# Network: Proton VPN (WireGuard, secret PROTON_WG_CONF) by default - no per-GB cost.
# The paid proxy is never used unless proxy=1 is asked for explicitly.
on:
  workflow_dispatch:
    inputs:
      query: { description: "search word to test", default: "dog shirt" }
      vpn:   { description: "1 = go out through Proton VPN (free data), 0 = plain runner IP", default: "1" }
      proxy: { description: "1 = paid proxy (counts GB) - only if asked", default: "0" }
      engine: { description: "pw = Playwright, uc = stealth Chrome (SeleniumBase UC)", default: "pw" }
permissions:
  contents: read
concurrency: { group: temu-probe, cancel-in-progress: true }
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install playwright && playwright install --with-deps chromium && sudo apt-get install -y xvfb
      - name: Stealth Chrome deps
        if: github.event.inputs.engine == 'uc'
        run: pip install seleniumbase && (sbase get chromedriver || true)
      - name: Connect Proton VPN (WireGuard)
        if: github.event.inputs.vpn == '1'
        env: { WG: "${{ secrets.PROTON_WG_CONF }}" }
        run: |
          if [ -z "$WG" ]; then echo "::error::secret PROTON_WG_CONF is missing - add the Proton WireGuard .conf as a repo secret"; exit 1; fi
          sudo apt-get install -y wireguard-tools >/dev/null
          echo "before VPN: $(curl -s https://ipinfo.io/json | python3 -c 'import sys,json;d=json.load(sys.stdin);print(d.get("ip"),d.get("org"),d.get("city"))')"
          printf '%s\n' "$WG" | sed -e 's#, *::/0##' -e '/^DNS *=/d' | sudo tee /etc/wireguard/proton.conf >/dev/null && sudo chmod 600 /etc/wireguard/proton.conf
          sudo wg-quick up proton
          sudo resolvectl dns proton 10.2.0.1 && sudo resolvectl domain proton '~.' || { echo 'nameserver 10.2.0.1' | sudo tee /etc/resolv.conf >/dev/null; }
          sleep 3
          echo "after VPN:  $(curl -s --max-time 20 https://ipinfo.io/json | python3 -c 'import sys,json;d=json.load(sys.stdin);print(d.get("ip"),d.get("org"),d.get("city"))')"
      - name: Run the probe
        env:
          TEMU_QUERY: ${{ github.event.inputs.query }}
          TEMU_PROXY: ${{ github.event.inputs.proxy }}
          PROXY_URL: ${{ github.event.inputs.proxy == '1' && secrets.PROXY_URL || '' }}
        run: |
          if [ "${{ github.event.inputs.engine }}" = "uc" ]; then python temu/temu_probe_uc.py; else xvfb-run -a python temu/temu_probe.py; fi
      - name: Disconnect VPN
        if: always() && github.event.inputs.vpn == '1'
        run: sudo wg-quick down proton 2>/dev/null || true
