name: Status page - delivery status refresh (same tracking numbers)
on: { workflow_dispatch: {} }
permissions: { contents: write }
concurrency: { group: status, cancel-in-progress: false }
jobs:
  quick:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/checkout@v4
        with: { ref: status-site, path: site }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install cryptography
      - name: Refresh the carrier status
        env:
          STATUS_SALT: ${{ secrets.STATUS_SALT }}
          PAGE_PAT: ${{ secrets.PAGE_PAT }}
          SHIPPO_LIVE_TOKEN: ${{ secrets.SHIPPO_LIVE_TOKEN }}
        run: python status/build.py status --site site
      - name: Publish
        run: |
          cd site
          git config user.name "status-bot"; git config user.email "status-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -qm "status $(date -u +%F_%H%M)"
          git push origin HEAD:status-site
