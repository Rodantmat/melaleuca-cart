name: Temu dump (HTML structure, runner IP, no commit)
on:
  workflow_dispatch:
    inputs:
      ids: { description: "goods ids, comma list", default: "601102364449217,603242230592430" }
      script: { description: "script under temu/", default: "temu_dump.py" }
permissions:
  contents: read
jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install "curl_cffi>=0.7"
      - env: { TEMU_IDS: "${{ github.event.inputs.ids }}" }
        run: python temu/${{ github.event.inputs.script || 'temu_dump.py' }}
