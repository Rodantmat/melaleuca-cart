name: Inbound send test
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: inboundtest, cancel-in-progress: false }
jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Run the exact script the Excel button runs (test mode cancels the test plan afterwards)
        env: { CRED_ENV: "${{ secrets.CREDENTIALS_ENV }}" }
        run: |
          mkdir -p /tmp/so
          cd feedwork
          printf '%s\n' "$CRED_ENV" > credentials.txt
          for f in inbound_test.tsv inbound_test_Vancouver.tsv inbound_test_SanDiego.tsv; do echo "=== $f"; python sd_tools.py inbound $f test 2>&1 | tee -a /tmp/so/run.log; done
          rm -f credentials.txt
      - name: Publish
        if: always()
        run: |
          git config user.name "feed-bot"; git config user.email "feed-bot@users.noreply.github.com"
          git checkout --orphan it-new
          git rm -rf . >/dev/null 2>&1 || true
          cp -a /tmp/so/. .
          git add -A && git commit -qm "inbound test" && git push -f origin it-new:inbound-test
