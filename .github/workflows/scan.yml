name: Melaleuca scan (test bench)
on:
  workflow_dispatch:
    inputs:
      account:
        description: "Account number (secrets MELA_USER_<n> / MELA_PASS_<n>)"
        default: "1"
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install playwright && playwright install --with-deps chromium
      - name: Build accounts file and scan
        env:
          PROXY_URL: ${{ secrets.PROXY_URL }}
          U1: ${{ secrets.MELA_USER_1 }}
          P1: ${{ secrets.MELA_PASS_1 }}
        run: |
          cd local
          printf 'PROXY_URL=%s\nSTICKY_BASE=10000\nMELA_USER_7=%s\nMELA_PASS_7=%s\n' "$PROXY_URL" "$U1" "$P1" > credentials.env
          python melaleuca_run.py --only 7 2>&1 | tee ../scan.log
          cp feed/melaleuca_offers.json feed/account_offers.tsv ../ 2>/dev/null || true
          rm -f credentials.env
        continue-on-error: true
      - name: Save results to branch scan-results
        run: |
          git config user.name "scan-bot"; git config user.email "scan-bot@users.noreply.github.com"
          git checkout --orphan scan-results
          git rm -rf . >/dev/null 2>&1 || true
          mkdir -p results; cp melaleuca_offers.json account_offers.tsv scan.log results/ 2>/dev/null || true
          git add results; git commit -m "scan results" && git push -f origin scan-results
