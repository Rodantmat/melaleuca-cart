name: Melaleuca scan (test bench)
on:
  workflow_dispatch:
    inputs:
      account:
        description: "Account number (secrets MELA_USER_<n> / MELA_PASS_<n>)"
        default: "1"
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install playwright && playwright install --with-deps chromium
      - name: Build accounts file and scan
        env:
          PROXY_URL: ${{ secrets.PROXY_URL }}
          U1: ${{ secrets.MELA_USER_1 }}
          P1: ${{ secrets.MELA_PASS_1 }}
        run: |
          python - <<'PY'
          import json, os
          json.dump({"proxy": os.environ["PROXY_URL"], "sticky_base": 10000,
                     "accounts": [{"tab": "Antonio M", "user": os.environ["U1"], "pass": os.environ["P1"]}]}, open("accounts.json", "w"))
          PY
          python local/melaleuca_scan.py accounts.json melaleuca_offers.json 2>&1 | tee scan.log
          rm -f accounts.json
        continue-on-error: true
      - name: Save results to branch scan-results
        run: |
          git config user.name "scan-bot"; git config user.email "scan-bot@users.noreply.github.com"
          git checkout --orphan scan-results
          git rm -rf . >/dev/null 2>&1 || true
          mkdir -p results; cp melaleuca_offers.json scan.log results/ 2>/dev/null || true
          git add results; git commit -m "scan results" && git push -f origin scan-results
