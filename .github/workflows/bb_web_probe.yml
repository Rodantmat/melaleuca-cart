name: Buy Box web probe (logged out)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Run
        env: { PROXY_URL: "${{ secrets.PROXY_URL }}" }
        run: |
          mkdir -p /tmp/so
          cd reprice
          python bb_web_probe.py 2>&1 | tee /tmp/so/run.log
      - name: Publish
        if: always()
        run: |
          git config user.name "feed-bot"; git config user.email "feed-bot@users.noreply.github.com"
          git checkout --orphan bw-new
          git rm -rf . >/dev/null 2>&1 || true
          cp -a /tmp/so/. .
          git add -A && git commit -qm "bb web probe" && git push -f origin bw-new:bb-web-probe
