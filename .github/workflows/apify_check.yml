name: Apify check (account + tiny AliExpress / Temu test)
on:
  workflow_dispatch:
    inputs:
      ali:  { description: "AliExpress keywords | (empty = skip)", default: "garlic press|drawer organizer" }
      temu: { description: "Temu keywords | (empty = skip)", default: "garlic press" }
      amz:  { description: "Amazon ASINs | (empty = skip)", default: "" }
      max:  { description: "results per keyword", default: "20" }
permissions: { contents: read }
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN || secrets.APIFY_API_TOKEN || secrets.APIFY_KEY || secrets.APIFY }}
        run: python temu/apify_source.py --check --ali "${{ github.event.inputs.ali }}" --temu "${{ github.event.inputs.temu }}" --amz "${{ github.event.inputs.amz }}" --max "${{ github.event.inputs.max }}"
