name: Capital snapshot
on: { workflow_dispatch: {} }
permissions: { contents: write }
concurrency: { group: reprice-state, cancel-in-progress: false }
jobs:
  cap:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Fetch saved state
        run: git fetch origin reprice-state:reprice-state 2>/dev/null && git checkout reprice-state -- reprice/state 2>/dev/null || true
      - name: Run
        env: { CRED_ENV: "${{ secrets.CREDENTIALS_ENV }}" }
        run: |
          set -o pipefail
          cd reprice
          printf '%s\n' "$CRED_ENV" > credentials.env
          python capital.py 2>&1 | tee capital.log
          rm -f credentials.env
      - name: Save state
        if: always()
        run: |
          git config user.name "reprice-bot"; git config user.email "reprice-bot@users.noreply.github.com"
          rm -rf /tmp/st && mkdir -p /tmp/st/state && cp -a reprice/state/. /tmp/st/state/ && cp reprice/capital.log /tmp/st/ 2>/dev/null || true
          git checkout --orphan reprice-state-new
          git rm -rf . >/dev/null 2>&1 || true
          mkdir -p reprice/state && cp -a /tmp/st/state/. reprice/state/ && cp /tmp/st/capital.log reprice/ 2>/dev/null || true
          git add reprice && git commit -qm "capital snapshot" && git push -f origin reprice-state-new:reprice-state
