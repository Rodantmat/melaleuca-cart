name: Temu cooldown test (trip on purpose, then probe every 3 min)
on: { workflow_dispatch: {} }
permissions: { contents: write }
concurrency: { group: temu-cooldown, cancel-in-progress: false }
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: |
          pip install -q "curl_cffi>=0.7"
          cp temu/temu_cooldown.py /tmp/c.py
          git config user.name "temu-bot"; git config user.email "temu-bot@users.noreply.github.com"
          git fetch -q origin temu-data:temu-data && git checkout -q temu-data
          mkdir -p temu && python /tmp/c.py temu/cooldown.log
