name: Amazon listing probe (preview only)
on: { workflow_dispatch: {} }
permissions: { contents: read }
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Probe (VALIDATION_PREVIEW only - publishes nothing)
        env:
          CRED_ENV: ${{ secrets.CREDENTIALS_ENV }}
          AMZ_CLIENT: ${{ secrets.AMZ_CLIENT }}
          AMZ_SECRET: ${{ secrets.AMZ_SECRET }}
        run: |
          cd reprice
          printf '%s\n' "$CRED_ENV" > credentials.env
          if [ -n "$AMZ_SECRET" ]; then printf 'CLIENT_ID=%s\nCLIENT_SECRET=%s\n' "$AMZ_CLIENT" "$AMZ_SECRET" >> credentials.env; fi
          python listing_probe.py 2>&1 | tee probe.log
          rm -f credentials.env
