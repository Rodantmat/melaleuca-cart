name: Temu probe 2 (browserless routes x free exits, no commit)
# Tests plain-HTTPS reads of Temu product pages / homepage / search-engine lookups on three FREE exits:
# plain runner IP, Proton VPN (secret PROTON_WG_CONF), Cloudflare WARP (free, socks proxy mode).
# Also runs the Playwright homepage probe through WARP. The paid proxy is never used here.
on:
  workflow_dispatch:
    inputs:
      query: { description: "search word", default: "dog shirt" }
permissions:
  contents: read
concurrency: { group: temu-probe2, cancel-in-progress: true }
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        net: [runner, proton, warp]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install "curl_cffi>=0.7" playwright && playwright install --with-deps chromium && sudo apt-get install -y xvfb
      - name: Proton VPN (WireGuard)
        if: matrix.net == 'proton'
        env: { WG: "${{ secrets.PROTON_WG_CONF }}" }
        run: |
          sudo apt-get install -y wireguard-tools >/dev/null
          printf '%s\n' "$WG" | sed -e 's#, *::/0##' -e '/^DNS *=/d' | sudo tee /etc/wireguard/proton.conf >/dev/null && sudo chmod 600 /etc/wireguard/proton.conf
          sudo wg-quick up proton
          sudo resolvectl dns proton 10.2.0.1 && sudo resolvectl domain proton '~.' || true
          echo "exit: $(curl -s --max-time 20 https://ipinfo.io/org)"
      - name: Cloudflare WARP (free, socks5 proxy mode on 127.0.0.1:40000)
        if: matrix.net == 'warp'
        run: |
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --yes --dearmor --output /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
          sudo apt-get update -qq && sudo apt-get install -y -qq cloudflare-warp
          sleep 3
          warp-cli --accept-tos registration new
          warp-cli --accept-tos mode proxy
          warp-cli --accept-tos connect
          for i in $(seq 1 20); do warp-cli --accept-tos status | grep -q Connected && break; sleep 2; done
          warp-cli --accept-tos status
          echo "exit via warp: $(curl -s --max-time 20 -x socks5h://127.0.0.1:40000 https://ipinfo.io/org)"
          echo "TEMU_SOCKS=socks5h://127.0.0.1:40000" >> "$GITHUB_ENV"
      - name: Browserless probe
        env: { TEMU_QUERY: "${{ github.event.inputs.query }}" }
        run: python temu/temu_probe2.py
      - name: Browser homepage probe through WARP
        if: matrix.net == 'warp'
        env: { TEMU_QUERY: "${{ github.event.inputs.query }}", TEMU_PROXY: "0" }
        run: xvfb-run -a python temu/temu_probe.py || true
