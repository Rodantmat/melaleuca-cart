name: URL probe
on: { workflow_dispatch: {} }
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for u in tee/french_bulldog/1CR.jpg tee/french_bulldog/2CR.jpg amz/tee/french_bulldog/1WH.jpg amz/tee/french_bulldog/2CR.jpg; do
            for ua in "Mozilla/5.0" "Amazon CloudFront" "python-requests/2.31" "Amazonbot/0.1" "AmazonProductAds/1.0"; do
              echo "$u | $ua | $(curl -s -o /dev/null -w '%{http_code} %{content_type}' -A "$ua" https://alphadogstyles.com/mk/$u)"
            done
          done
