name: Buy Box web scan (logged out)
on:
  workflow_dispatch:
    inputs:
      max: { description: "max ASINs (0 = all)", default: "0" }
  schedule:
    - cron: "37 9 * * *"
permissions:
  contents: write
concurrency: { group: reprice-state, cancel-in-progress: false }
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install playwright && playwright install --with-deps chromium && sudo apt-get install -y xvfb
      - name: Fetch saved state
        run: git fetch origin reprice-state:reprice-state 2>/dev/null && git checkout reprice-state -- reprice/state reprice/run.log 2>/dev/null || git checkout reprice-state -- reprice/state 2>/dev/null || true
      - name: Scan the public pages
        env: { PROXY_URL: "${{ secrets.PROXY_URL }}" }
        run: |
          cd reprice
          xvfb-run -a python bb_web.py ${{ github.event.inputs.max || '0' }} 2>&1 | tee run_bbweb.log
      - name: Save state
        if: always()
        run: |
          git config user.name "reprice-bot"; git config user.email "reprice-bot@users.noreply.github.com"
          rm -rf /tmp/st && mkdir /tmp/st && mkdir -p /tmp/st/state && cp -a reprice/state/. /tmp/st/state/ && cp reprice/run_bbweb.log reprice/run.log /tmp/st/ 2>/dev/null || true
          git checkout --orphan reprice-state-new
          git rm -rf . >/dev/null 2>&1 || true
          mkdir -p reprice/state && cp -a /tmp/st/state/. reprice/state/ && cp /tmp/st/run_bbweb.log /tmp/st/run.log reprice/ 2>/dev/null || true
          git add reprice && git commit -qm "reprice state (web bb)" && git push -f origin reprice-state-new:reprice-state
