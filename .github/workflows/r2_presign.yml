name: R2 presigned upload URLs (private, counts only)
on:
  workflow_dispatch:
    inputs:
      keys: { description: "object keys separated by space", default: "" }
permissions: { contents: read }
jobs:
  presign:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q boto3 "psycopg[binary]"
      - env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          KEYS: ${{ github.event.inputs.keys }}
        run: |
          python temu/r2_presign.py 2>&1 | grep -E "^r2_presign|Traceback|Error" | head -5
