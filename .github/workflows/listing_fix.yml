name: Listing fix (one SKU)
on:
  workflow_dispatch:
    inputs:
      sku: { description: "SKU", default: "ME1128", required: true }
      fix: { description: "none | preview | apply", default: "none", required: false }
permissions:
  contents: write
concurrency: { group: listingfix, cancel-in-progress: false }
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Fetch seller id
        run: git fetch origin reprice-state:reprice-state 2>/dev/null && git checkout reprice-state -- reprice/state/seller.txt 2>/dev/null || true
      - name: Check
        env: { CRED_ENV: "${{ secrets.CREDENTIALS_ENV }}", AMZ_CLIENT: "${{ secrets.AMZ_CLIENT }}", AMZ_SECRET: "${{ secrets.AMZ_SECRET }}", AMZ_REFRESH: "${{ secrets.AMZ_REFRESH }}" }
        run: |
          set -o pipefail
          cd reprice
          printf '%s\n' "$CRED_ENV" > credentials.env
          if [ -n "$AMZ_SECRET" ] && [ -n "$AMZ_REFRESH" ]; then
            grep -v -i -E '^[[:space:]]*(CLIENT_ID|CLIENT_SECRET|REFRESH_TOKEN)[[:space:]]*=' credentials.env > credentials.env.tmp; mv credentials.env.tmp credentials.env
            printf 'CLIENT_ID=%s\nCLIENT_SECRET=%s\nREFRESH_TOKEN=%s\n' "$AMZ_CLIENT" "$AMZ_SECRET" "$AMZ_REFRESH" >> credentials.env
          elif [ -n "$AMZ_SECRET" ]; then printf 'CLIENT_ID=%s\nCLIENT_SECRET=%s\n' "$AMZ_CLIENT" "$AMZ_SECRET" >> credentials.env; fi
          FIX=${{ github.event.inputs.fix }} python listing_fix.py ${{ github.event.inputs.sku }} 2>&1 | tee listing_fix.log
          rm -f credentials.env
      - name: Publish
        if: always()
        run: |
          git config user.name "feed-bot"; git config user.email "feed-bot@users.noreply.github.com"
          rm -rf /tmp/so && mkdir -p /tmp/so
          cp reprice/listing_fix.log /tmp/so/ 2>/dev/null || true
          find . -name credentials.env -not -path "./.git/*" -delete  # SCRUB secrets before anything is committed
          git checkout --orphan lf-new
          git rm -rf . >/dev/null 2>&1 || true
          cp -a /tmp/so/. .
          find . -name 'credentials.*' -not -path './.git/*' -delete; git add -A && git commit -qm "listing fix" && git push -f origin lf-new:listing-fix
