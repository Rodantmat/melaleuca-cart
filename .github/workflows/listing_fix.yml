name: Listing fix (one SKU)
on:
  workflow_dispatch:
    inputs:
      sku: { description: "SKU", default: "ME1128", required: true }
      fix: { description: "none | preview | apply", default: "none", required: false }
permissions:
  contents: write
concurrency: { group: listingfix, cancel-in-progress: false }
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Fetch seller id
        run: git fetch origin reprice-state:reprice-state 2>/dev/null && git checkout reprice-state -- reprice/state/seller.txt 2>/dev/null || true
      - name: Check
        env: { CRED_ENV: "${{ secrets.CREDENTIALS_ENV }}", AMZ_CLIENT: "${{ secrets.AMZ_CLIENT }}", AMZ_SECRET: "${{ secrets.AMZ_SECRET }}" }
        run: |
          set -o pipefail
          cd reprice
          printf '%s\n' "$CRED_ENV" > credentials.env
          if [ -n "$AMZ_SECRET" ]; then printf 'CLIENT_ID=%s\nCLIENT_SECRET=%s\n' "$AMZ_CLIENT" "$AMZ_SECRET" >> credentials.env; fi
          python3 -c "import re;d=dict(l.strip().split('=',1) for l in open('credentials.env') if '=' in l);s=d.get('CLIENT_SECRET','');print('DIAG secret_len',len(s),'new_prefix',s.startswith('amzn1.oa2-cs.v1.1e1526'),'client_ok',d.get('CLIENT_ID','').startswith('amzn1.application-oa2-client.0ee569'),'dupes',sum(1 for l in open('credentials.env') if l.startswith('CLIENT_SECRET=')))"
          FIX=${{ github.event.inputs.fix }} python listing_fix.py ${{ github.event.inputs.sku }} 2>&1 | tee listing_fix.log
          rm -f credentials.env
      - name: Publish
        if: always()
        run: |
          git config user.name "feed-bot"; git config user.email "feed-bot@users.noreply.github.com"
          rm -rf /tmp/so && mkdir -p /tmp/so
          cp reprice/listing_fix.log /tmp/so/ 2>/dev/null || true
          find . -name credentials.env -not -path "./.git/*" -delete  # SCRUB secrets before anything is committed
          git checkout --orphan lf-new
          git rm -rf . >/dev/null 2>&1 || true
          cp -a /tmp/so/. .
          git add -A && git commit -qm "listing fix" && git push -f origin lf-new:listing-fix
