name: Amazon feed (daily)
on:
  workflow_dispatch: {}
  schedule:
    - cron: "41 11 * * *"
permissions:
  contents: write
concurrency: { group: feed, cancel-in-progress: false }
jobs:
  feed:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Fetch order and stock history (for the true-demand columns)
        run: |
          git fetch origin reprice-state:reprice-state 2>/dev/null && git checkout reprice-state -- reprice/state 2>/dev/null || true
          mkdir -p feedwork/state
          cp reprice/state/orders_*.tsv reprice/state/ledger_*.tsv feedwork/state/ 2>/dev/null || true
          ls feedwork/state | wc -l
      - name: Build the feed
        env: { CRED_ENV: "${{ secrets.CREDENTIALS_ENV }}" }
        run: |
          set -o pipefail
          cd feedwork
          printf '%s\n' "$CRED_ENV" > credentials.txt
          python amazon_feed.py refresh 2>&1 | tee feed_run.log
          rm -f credentials.txt
      - name: Publish to branch feed-latest
        if: always()
        run: |
          git config user.name "feed-bot"; git config user.email "feed-bot@users.noreply.github.com"
          rm -rf /tmp/fo && mkdir -p /tmp/fo/feed
          cp feedwork/feed/*.tsv feedwork/feed/feed_status.json feedwork/feed/fees_good.json /tmp/fo/feed/ 2>/dev/null || true
          cp feedwork/feed_run.log /tmp/fo/ 2>/dev/null || true
          git checkout --orphan feed-new
          git rm -rf . >/dev/null 2>&1 || true
          cp -a /tmp/fo/. . 
          git add -A && git commit -qm "feed $(date -u +%F_%H%M)" && git push -f origin feed-new:feed-latest
