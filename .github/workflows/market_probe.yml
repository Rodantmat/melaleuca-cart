name: Market probe (AliExpress / SHEIN readability, temporary, no commit)
on: { workflow_dispatch: {} }
permissions: { contents: read }
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q "curl_cffi>=0.7"
      - run: python temu/market_probe.py
