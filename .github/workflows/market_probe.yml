name: Market probe (temporary, no commit)
on:
  workflow_dispatch:
    inputs:
      script: { description: "script under temu/", default: "market_probe2.py" }
permissions: { contents: read }
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q "curl_cffi>=0.7"
      - run: python temu/${{ github.event.inputs.script }}
