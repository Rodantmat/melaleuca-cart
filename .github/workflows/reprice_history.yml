name: Reprice - build history
on:
  workflow_dispatch:
    inputs:
      months: { description: "months of history", default: "24" }
permissions:
  contents: write
jobs:
  history:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Fetch saved state
        run: |
          git fetch origin reprice-state:reprice-state 2>/dev/null && git checkout reprice-state -- reprice/state 2>/dev/null || true
      - name: Build history
        env:
          CRED_ENV: ${{ secrets.CREDENTIALS_ENV }}
        run: |
          set -o pipefail
          cd reprice
          printf '%s\n' "$CRED_ENV" > credentials.env
          python history.py ${{ github.event.inputs.months }} 2>&1 | tee history.log
          rm -f credentials.env
      - name: Save state
        if: always()
        run: |
          git config user.name "reprice-bot"; git config user.email "reprice-bot@users.noreply.github.com"
          rm -rf /tmp/st && mkdir /tmp/st && mkdir -p /tmp/st/state && cp -a reprice/state/. /tmp/st/state/ && cp reprice/history.log /tmp/st/ 2>/dev/null || true
          git checkout --orphan reprice-state-new
          git rm -rf . >/dev/null 2>&1 || true
          mkdir -p reprice && mkdir -p reprice/state && cp -a /tmp/st/state/. reprice/state/ && cp /tmp/st/history.log reprice/ 2>/dev/null || true
          git add reprice && git commit -qm "reprice state (history)" && git push -f origin reprice-state-new:reprice-state
