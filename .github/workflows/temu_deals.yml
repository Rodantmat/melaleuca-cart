name: Temu deals -> Amazon profit (read-only on Amazon)
# Temu items (live paced search, or the last saved Temu pull) -> Amazon match, live offers, fees, profit/ROI, abandoned listings.
# Results: branch temu-data -> temu/deals/deals_latest.csv|json (+ dated copy). Nothing is listed or changed on Amazon.
on:
  workflow_dispatch:
    inputs:
      search:   { description: "chunk:N/M = part N of M of temu/keywords.txt (~110 generic keywords), or keywords separated by |, or empty = last saved Temu pull", default: "chunk:1/4" }
      roi_min:  { description: "min ROI to flag (0.30 = 30%)", default: "0.30" }
      max_temu: { description: "max Temu price to consider", default: "25" }
      wholesale_factor: { description: "est. Alibaba unit price = Temu price x this", default: "0.60" }
      freight: { description: "est. Alibaba freight + duties per unit", default: "1.00" }
permissions:
  contents: write
  actions: write
concurrency: { group: temu-bridge, cancel-in-progress: false }
jobs:
  deals:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q "curl_cffi>=0.7"
      - name: Last saved Temu pull
        run: git fetch -q origin temu-data && git show origin/temu-data:temu/latest.json > /tmp/temu_last.json || echo '{}' > /tmp/temu_last.json
      - name: Find deals
        env:
          CRED_ENV: ${{ secrets.CREDENTIALS_ENV }}
          Q: ${{ github.event.inputs.search }}
          ROI_MIN: ${{ github.event.inputs.roi_min }}
          MAX_TEMU_PRICE: ${{ github.event.inputs.max_temu }}
          WHOLESALE_FACTOR: ${{ github.event.inputs.wholesale_factor }}
          FREIGHT_PER_UNIT: ${{ github.event.inputs.freight }}
        run: |
          mkdir -p /tmp/deals; printf '%s\n' "$CRED_ENV" > reprice/credentials.env
          if [ -n "$Q" ]; then ARGS=(--search "$Q"); else ARGS=(--from-json /tmp/temu_last.json); fi
          python temu/deal_finder.py "${ARGS[@]}" --out /tmp/deals 2>&1 | tee /tmp/deals/run.log || true
          rm -f reprice/credentials.env
          { echo '```'; tail -70 /tmp/deals/run.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Save to temu-data
        if: always()
        run: |
          ls /tmp/deals/deals_*.json >/dev/null 2>&1 || exit 0
          TS=$(date -u +%Y%m%dT%H%MZ)
          git config user.name "temu-bot"; git config user.email "temu-bot@users.noreply.github.com"
          git checkout -q -B temu-data origin/temu-data
          mkdir -p temu/deals
          cp /tmp/deals/deals_*.csv /tmp/deals/deals_*.json temu/deals/
          cp /tmp/deals/run.log "temu/deals/run_$TS.log"
          git add temu/deals && git commit -qm "deals $TS" && git push -q origin temu-data
