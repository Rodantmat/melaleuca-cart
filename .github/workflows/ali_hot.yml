name: AliExpress hot feed (private storage, counts only)
on:
  workflow_dispatch:
    inputs:
      cats: { description: "category ids comma separated (blank = all)", default: "" }
      kws: { description: "keywords separated by |", default: "" }
permissions: { contents: read }
jobs:
  hot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q "psycopg[binary]"
      - env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ALIEXPRESS_APP_KEY: ${{ secrets.ALIEXPRESS_APP_KEY }}
          ALIEXPRESS_APP_SECRET: ${{ secrets.ALIEXPRESS_APP_SECRET }}
          CATS: ${{ github.event.inputs.cats }}
          KWS: ${{ github.event.inputs.kws }}
        run: |
          python temu/ali_hot.py 2>&1 | tail -8
