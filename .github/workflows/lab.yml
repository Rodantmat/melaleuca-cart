name: Melaleuca lab (test bench)
on:
  workflow_dispatch:
    inputs:
      script:
        description: "script in local/ to run"
        default: "melaleuca_probe2.py"
      args:
        description: "arguments"
        default: "7"
permissions:
  contents: write
jobs:
  lab:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install playwright && playwright install --with-deps chromium
      - name: Run
        env:
          PROXY_URL: ${{ secrets.PROXY_URL }}
          U1: ${{ secrets.MELA_USER_1 }}
          P1: ${{ secrets.MELA_PASS_1 }}
        run: |
          cd local
          printf 'PROXY_URL=%s\nSTICKY_BASE=10000\nMELA_USER_7=%s\nMELA_PASS_7=%s\n' "$PROXY_URL" "$U1" "$P1" > credentials.env
          python ${{ github.event.inputs.script }} ${{ github.event.inputs.args }} 2>&1 | tee ../lab.log
          rm -f credentials.env
        continue-on-error: true
      - name: Save results to branch lab-results
        if: always()
        run: |
          git config user.name "lab-bot"; git config user.email "lab-bot@users.noreply.github.com"
          mkdir -p /tmp/res && cp lab.log /tmp/res/ ; cp -r local/feed /tmp/res/feed; rm -rf /tmp/res/feed/plans 2>/dev/null || true
          rm -rf /tmp/res/feed/debug/*.png
          git checkout --orphan lab-results-${{ github.run_id }}
          git rm -rf . >/dev/null 2>&1 || true
          mkdir -p results && cp -r /tmp/res/* results/
          git add results && git commit -m "lab results" && git push -f origin lab-results-${{ github.run_id }}
