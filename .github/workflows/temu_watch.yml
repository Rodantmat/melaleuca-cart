name: Temu watch (2-request check; loop=1 re-checks every 10 min until Temu reopens)
on:
  workflow_dispatch:
    inputs:
      loop: { description: "1 = re-check every 10 min until Temu reopens (max 5.5 h)", default: "0" }
permissions: { contents: write }
concurrency: { group: temu-watch, cancel-in-progress: false }
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - name: Stop after the 48 h window (scheduled runs only)
        id: win
        run: if [ "${{ github.event_name }}" = "schedule" ] && [ "$(date -u +%Y%m%d%H)" -gt 2026111220 ]; then echo "done=1" >> "$GITHUB_OUTPUT"; echo "window over"; fi
      - uses: actions/checkout@v4
        if: steps.win.outputs.done != '1'
      - uses: actions/setup-python@v5
        if: steps.win.outputs.done != '1'
        with: { python-version: "3.12" }
      - if: steps.win.outputs.done != '1'
        run: |
          pip install -q "curl_cffi>=0.7"
          cp temu/temu_watch.py /tmp/w.py
          git config user.name "temu-bot"; git config user.email "temu-bot@users.noreply.github.com"
          git fetch -q origin temu-data:temu-data && git checkout -q temu-data
          mkdir -p temu && WATCH_PUSH=1 WATCH_LOOP="${{ github.event.inputs.loop || '0' }}" python /tmp/w.py temu/watch.log
