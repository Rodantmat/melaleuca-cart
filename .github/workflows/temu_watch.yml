name: Temu watch (hourly 2-request check, stops itself after 2026-11-12 20:00 UTC)
on:
  schedule: [{ cron: "17 * * * *" }]
  workflow_dispatch: {}
permissions: { contents: write }
concurrency: { group: temu-watch, cancel-in-progress: false }
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Stop after the 48 h window
        id: win
        run: if [ "$(date -u +%Y%m%d%H)" -gt 2026111220 ]; then echo "done=1" >> "$GITHUB_OUTPUT"; echo "window over"; fi
      - uses: actions/checkout@v4
        if: steps.win.outputs.done != '1'
      - uses: actions/setup-python@v5
        if: steps.win.outputs.done != '1'
        with: { python-version: "3.12" }
      - if: steps.win.outputs.done != '1'
        run: |
          pip install -q "curl_cffi>=0.7"
          cp temu/temu_watch.py /tmp/w.py
          git config user.name "temu-bot"; git config user.email "temu-bot@users.noreply.github.com"
          git fetch -q origin temu-data:temu-data && git checkout -q temu-data
          mkdir -p temu && python /tmp/w.py temu/watch.log
          git add temu/watch.log && git commit -qm "temu watch $(date -u +%H:%M)" && git push -q origin temu-data
