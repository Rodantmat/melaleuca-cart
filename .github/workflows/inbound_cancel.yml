name: Cancel one test inbound plan
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Cancel
        env: { CRED_ENV: "${{ secrets.CREDENTIALS_ENV }}" }
        run: |
          mkdir -p /tmp/so
          cd feedwork
          printf '%s\n' "$CRED_ENV" > credentials.txt
          python sd_tools.py cancel wfc826425c-cbaf-46cd-8d96-1a4a392a0792 2>&1 | tee /tmp/so/run.log
          rm -f credentials.txt
      - name: Publish
        if: always()
        run: |
          git config user.name "feed-bot"; git config user.email "feed-bot@users.noreply.github.com"
          git checkout --orphan ic-new
          git rm -rf . >/dev/null 2>&1 || true
          cp -a /tmp/so/. .
          git add -A && git commit -qm "cancel" && git push -f origin ic-new:inbound-cancel
